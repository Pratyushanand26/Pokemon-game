<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body style="background-color: black;">
  <h1 id="heading">Get Pokemon Details</h1>
  <div class="input">
    <input type="number" placeholder="Select no of pokemon" id="number" style="width: 90%; height: 25px; padding-left: 10px; background-color: aquamarine;">
  </div>
  
  <br>
  <h3 style="color: wheat; text-align: center;">Select type of pokemon</h3>
  <br>
  <div class="input">
    <select id="category" placeholder="select type of pokemon" style="width: 90%; height: 25px; padding-left: 10px; background-color: aqua;">
      <option value="All" selected>All</option>
      <option value="normal">normal</option>
      <option value="fighting">fighting</option>
      <option value="flying">flying</option>
      <option value="poison">poison</option>
      <option value="ground">ground</option>
      <option value="rock">rock</option>
      <option value="bug">bug</option>
      <option value="ghost">ghost</option>
      <option value="steel">steel</option>
      <option value="fire">fire</option>
      <option value="water">water</option>
      <option value="grass">grass</option>
      <option value="electric">electric</option>
      <option value="psychic">psychic</option>
      <option value="ice">ice</option>
      <option value="dragon">dragon</option>
      <option value="dark">dark</option>
      <option value="fairy">fairy</option>
      <option value="stellar">stellar</option>
      <option value="unknown">unknown</option>
    </select>
  </div>
 
  <br>
  <div class="input">
    <button id="Submit-button" onclick="PokemonData()" style="width: 10%; height: 35px; padding: auto; background-color: grey;">Submit</button>
  </div>

  <br>
  <br>
 
<div id="pokedetail"></div>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
